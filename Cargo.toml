[package]
name = "lol-mod-fixer"
version = "0.2.0"
edition = "2024"
description = "Standalone native CLI tool for League of Legends mod diagnosis and repair"
license = "GPL-3.0-or-later"
repository = "https://github.com/jsoul-dev/lol-mod-fixer"

[dependencies]
ltk-manager-base = { path = "vendor/ltk-manager/crates/ltk-manager-base" }
ltk-manager-assets = { path = "vendor/ltk-manager/crates/ltk-manager-assets", features = ["test-util"] }
ltk-manager-bin = { path = "vendor/ltk-manager/crates/ltk-manager-bin" }
ltk-manager-library = { path = "vendor/ltk-manager/crates/ltk-manager-library" }
ltk-manager-problems = { path = "vendor/ltk-manager/crates/ltk-manager-problems" }
ltk-manager-workshop = { path = "vendor/ltk-manager/crates/ltk-manager-workshop" }

ltk_fantome = "0.15.1"
ltk_hash = "0.4.0"
ltk_meta = "0.8.6"
ltk_mod_project = { version = "0.16.2", features = ["modpkg", "fantome"] }
ltk_modpkg = "0.12.9"
ltk_wad = "0.5.8"

clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
camino = "1.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
directories = "5.0"
tempfile = "3"
fs-err = "3"
crossterm = "0.28"
zip = "2.4.2"
sha2 = "0.10"
chrono = "0.4"


[dev-dependencies]
ltk-manager-assets = { path = "vendor/ltk-manager/crates/ltk-manager-assets", features = ["test-util"] }
assert_matches = "1.5"
