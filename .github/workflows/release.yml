name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --release

      - name: Build Standalone Static Binary (+crt-static)
        run: cargo build --release

      - name: Stage Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Copy-Item "target/release/lol-mod-fixer.exe" "release-artifacts/lol-mod-fixer.exe"
          Get-Item release-artifacts/*

      - name: Assemble Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: pwsh .github/scripts/generate-release-notes.ps1 -Tag "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/lol-mod-fixer.exe
          body_path: release-artifacts/RELEASE-BODY.md
          generate_release_notes: true
