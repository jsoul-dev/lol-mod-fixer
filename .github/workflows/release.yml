name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --release

      - name: Build Dynamic Binary
        run: cargo build --release

      - name: Build Standalone Static Binary (+crt-static)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Copy-Item "target/x86_64-pc-windows-msvc/release/lol-mod-fixer.exe" "release-artifacts/lol-mod-fixer-static.exe"
          Copy-Item "target/release/lol-mod-fixer.exe" "release-artifacts/lol-mod-fixer-dynamic.exe"
          Copy-Item "run-fixer-as-admin.bat" "release-artifacts/run-fixer-as-admin.bat"
          Get-Item release-artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/lol-mod-fixer-static.exe
            release-artifacts/lol-mod-fixer-dynamic.exe
            release-artifacts/run-fixer-as-admin.bat
          generate_release_notes: true
